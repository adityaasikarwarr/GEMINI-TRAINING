<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SignBuddy AI</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="hero">
    

      <div class="text">
        <h1>
          Meet<br />
          SignBuddy AI 🤟
        </h1>
m
        <p>Your friendly AI sign language translator</p>

        <button onclick="changeSign('hello')">Hello 👋</button>

        <button onclick="changeSign('thankyou')">Thank You 🤟</button>

        <button onclick="changeSign('love')">Love ❤️</button>
      </div>

      <!-- CHARACTER SECTION -->

      <div class="avatar-section">
        <!-- Speech Bubble -->

        <div class="speech">Hi! I can communicate with you 😊</div>

        <div class="character">

          <div class="head">
            <div class="hair"></div>

            <div class="eye left-eye"></div>

            <div class="eye right-eye"></div>

            <div class="smile"></div>
          </div>

          <div class="hoodie">
            <div class="logo">🤟</div>
          </div>

          <div class="arm left-arm">✋</div>

          <div class="arm right-arm">🤟</div>


          <div class="leg left-leg"></div>

          <div class="leg right-leg"></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
